<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindSpace</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="navbar">
        <h1>MindSpace</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href ="journal.html">Journal</a></li>
                <li><a href ="tasks.html">Tasks</a></li>
                <li><a href ="activities.html">Activities</a></li>
                <li><a href ="about.html">About</a></li>
            </ul>
        </nav>
    </div>

    <hr>

    <div class="introText">
        <h2>-Journal-</h2>
        <p class="pageDescription">Need a space to clear your mind? Write down whatever you’d like in your own journal.</p>
    </div>

    <div id="journalContainer">
        
        <div id="containers">
            <div id="entriesContainer">
                <input type="text" name="search" id="journalSearch" placeholder="Search...">

                <div>
                    <ul id="entries">
                        <!-- <li><span>Jan 16, 2026</span><br>Bro, I'm Cooked</li> 
                        <li><span>March 01, 2026</span><br>Another Long Day</li>
                        <li><span>June 24, 2026</span><br>Stressed at Work</li>
                        -->
                    </ul>
                </div>

            </div>

            <div id="newEntryContainer">
                <input type="text" name="entryTitle" id="entryTitleInput" placeholder="Entry Title">
                <br>
                <input type="text" name="date" id="dateInput" placeholder="Date">
                <textarea name="entry" id="entryInput" placeholder="Start journal entry here..."></textarea>

                <button onclick="addEntry()" id="addEntryButton">Add</button>
            </div>
        </div>

    </div>

    <script src="journal.js"></script>

</body>

</html>
